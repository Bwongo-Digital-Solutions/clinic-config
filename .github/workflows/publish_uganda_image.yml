name: Publish Uganda clinic config image

on:
  pull_request:
    paths:
      - "openmrs/**"
      - "masterdata/**"
      - "print-templates/**"
      - "web/**"
      - "scripts/**"
      - "package/docker/**"
      - ".github/workflows/publish_uganda_image.yml"
  push:
    branches:
      - dev
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: uganda-clinic-config-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/bwongo-digital-solutions/uganda-clinic-config

jobs:
  build:
    name: Validate and build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required config files
        run: |
          set -eu
          test -d openmrs
          test -d masterdata
          test -d print-templates
          test -d web/images
          test -s package/docker/Dockerfile
          test -s package/docker/start.sh
          test -s scripts/build_uganda_address_hierarchy.py
          test -s masterdata/configuration/addresshierarchy/addressConfiguration.xml

      - name: Generate and validate UBOS Uganda address hierarchy
        run: |
          set -eu
          python3 scripts/build_uganda_address_hierarchy.py --output /tmp/addresshierarchy.csv
          generated_rows="$(wc -l < /tmp/addresshierarchy.csv)"
          if [ "$generated_rows" -lt 70000 ] || [ "$generated_rows" -gt 71679 ]; then
            echo "Unexpected generated Uganda address path count: $generated_rows"
            exit 1
          fi
          python3 - <<'PY'
          import csv
          from pathlib import Path

          forbidden = {"himachal pradesh", "kangra", "india"}
          with Path("/tmp/addresshierarchy.csv").open(encoding="utf-8", newline="") as source:
              for line_number, row in enumerate(csv.reader(source, delimiter="|"), start=1):
                  matches = [value for value in row if value.strip().casefold() in forbidden]
                  if matches:
                      raise SystemExit(
                          f"Non-Ugandan address value detected at generated row {line_number}: {matches}"
                      )
          PY

      - name: Validate address hierarchy XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("masterdata/configuration/addresshierarchy/addressConfiguration.xml")
          root = ET.parse(path).getroot()
          wipe = root.findtext("wipe", default="").strip().lower()
          if wipe != "true":
              raise SystemExit(f"Expected targeted address hierarchy replacement, got wipe={wipe!r}")
          expected = ["COUNTRY", "COUNTY_DISTRICT", "STATE_PROVINCE", "ADDRESS_3", "ADDRESS_4", "ADDRESS_5"]
          actual = [node.findtext("field", default="").strip() for node in root.findall("addressComponents/addressComponent")]
          if actual != expected:
              raise SystemExit(f"Unexpected address component order: {actual}")
          if root.findtext("addressHierarchyFile/entryDelimiter", default="").strip() != chr(92) + "|":
              raise SystemExit("Address hierarchy delimiter must be the escaped pipe regex")
          filename = root.findtext("addressHierarchyFile/filename", default="").strip()
          if filename != "addresshierarchy.csv":
              raise SystemExit(f"Unexpected address hierarchy filename: {filename!r}")
          print("Validated Uganda address hierarchy mapping and targeted replacement mode.")
          PY

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build image (PR validation; publish on dev or tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: package/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
