name: Publish Uganda clinic config image

on:
  pull_request:
    paths:
      - "openmrs/**"
      - "masterdata/**"
      - "print-templates/**"
      - "package/docker/**"
      - ".github/workflows/publish_uganda_image.yml"
  push:
    branches:
      - dev
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: uganda-clinic-config-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/bwongo-digital-solutions/uganda-clinic-config

jobs:
  build:
    name: Validate and build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required config files
        run: |
          set -eu
          test -d openmrs
          test -d masterdata
          test -d print-templates
          test -s package/docker/Dockerfile
          test -s package/docker/start.sh
          test -s masterdata/configuration/addresshierarchy/addressConfiguration.xml
          test -s masterdata/configuration/addresshierarchy/addresshierarchy.csv

      - name: Validate address hierarchy XML and safe import mode
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("masterdata/configuration/addresshierarchy/addressConfiguration.xml")
          root = ET.parse(path).getroot()
          wipe = root.findtext("wipe", default="").strip().lower()
          if wipe != "false":
              raise SystemExit(f"Refusing unsafe address hierarchy wipe setting: {wipe!r}")
          filename = root.findtext("addressHierarchyFile/filename", default="").strip()
          if not filename:
              raise SystemExit("addressHierarchyFile/filename is missing")
          csv_path = path.parent / filename
          if not csv_path.is_file():
              raise SystemExit(f"Configured address hierarchy CSV not found: {csv_path}")
          print(f"Validated {path}; wipe=false; CSV={csv_path}")
          PY

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build image (PR validation; publish on dev or tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: package/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
