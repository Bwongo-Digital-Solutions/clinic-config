name: Build Clinic Config Development Image

on:
  push:
    branches:
      - dev
    paths:
      - "openmrs/**"
      - "masterdata/**"
      - "print-templates/**"
      - "web/**"
      - "package/docker/**"
      - ".github/workflows/build-dev-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build and publish GHCR image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: package/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/bwongo-digital-solutions/uganda-clinic-config:dev
            ghcr.io/bwongo-digital-solutions/uganda-clinic-config:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
